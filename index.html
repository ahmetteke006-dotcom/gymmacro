<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GymMacro</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  color:white;
}

.card {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(15px);
  padding:40px;
  border-radius:20px;
  width:350px;
  box-shadow:0 10px 40px rgba(0,0,0,0.4);
}

h1 {
  text-align:center;
  margin-bottom:25px;
  font-weight:600;
}

input, select {
  width:100%;
  padding:12px;
  margin-bottom:15px;
  border:none;
  border-radius:10px;
  font-size:14px;
}

button {
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#00ffcc;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

button:hover {
  background:#00ccaa;
}

.result {
  margin-top:20px;
  background:rgba(0,0,0,0.3);
  padding:15px;
  border-radius:10px;
  font-size:14px;
  line-height:1.6;
}
</style>
</head>
<body>

<div class="card">
<h1>GymMacro</h1>

<input type="number" id="weight" placeholder="Kilo (kg)">
<select id="goal">
  <option value="cut">Kilo Verme</option>
  <option value="bulk">Kas Yapma</option>
</select>

<button onclick="calculate()">Makroları Hesapla</button>

<div class="result" id="result"></div>
</div>

<script>
function calculate() {
  let weight = document.getElementById("weight").value;
  let goal = document.getElementById("goal").value;

  let calories = weight * 30;
  if (goal === "cut") calories -= 400;
  if (goal === "bulk") calories += 300;

  let protein = weight * 2.2;
  let fat = weight * 0.9;
  let carbs = (calories - (protein*4 + fat*9)) / 4;

  document.getElementById("result").innerHTML =
    "<strong>Günlük Hedef:</strong><br>" +
    "Kalori: " + Math.round(calories) + " kcal<br>" +
    "Protein: " + Math.round(protein) + " g<br>" +
    "Yağ: " + Math.round(fat) + " g<br>" +
    "Karbonhidrat: " + Math.round(carbs) + " g";
}
</script>

</body>
</html>
